name: Daily data update

on:
  # 10:17 UTC = 5:17am ET, after the night's games are final.
  # Runs October through April only (regular season).
  schedule:
    - cron: '17 10 * 10-12,1-4 *'
  # "Run workflow" button on the Actions tab, with optional seasons
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to re-scrape (space separated, e.g. "2025-26 2026-27"). Blank = current season only.'
        required: false
        default: ''
      raw_file:
        description: 'Optional: JSON file in the repo with NBA.com responses captured from a browser (used instead of calling NBA.com)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape NBA.com
        env:
          SEASONS: ${{ github.event.inputs.seasons }}
          RAW_FILE: ${{ github.event.inputs.raw_file }}
        run: |
          if [ -n "$RAW_FILE" ]; then
            python scrape_multi_season.py --raw "$RAW_FILE"
          elif [ -n "$SEASONS" ]; then
            python scrape_multi_season.py --seasons $SEASONS
          else
            python scrape_multi_season.py
          fi

      - name: Rebuild index.html
        run: python create_multi_season_website.py

      - name: Commit and push if data changed
        env:
          RAW_FILE: ${{ github.event.inputs.raw_file }}
        run: |
          if [ -n "$RAW_FILE" ]; then git rm -q --ignore-unmatch "$RAW_FILE"; fi
          git config user.name "3point-app bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_shooting_data_all_seasons.json metadata.json index.html
          if git diff --cached --quiet; then
            echo "No new stats today; nothing to commit."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git push
          fi
